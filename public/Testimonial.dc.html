<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:center;text-align:center;color:#F7F6F4;padding-inline:clamp(60px,10vw,140px)" class="sb-testimonial-inner">
  <div style="width:{{ avatarSize }}px;height:{{ avatarSize }}px;border-radius:50%;overflow:hidden;position:relative;flex:none">
    <div style="position:absolute;inset:0;background:radial-gradient(120% 100% at 20% 15%,#8b8478 0%,#6d6a63 32%,#4c4d50 58%,#33363c 100%)"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(90% 80% at 85% 90%,rgba(60,70,90,.55) 0%,rgba(60,70,90,0) 70%)"></div>
    <img src="{{ avatarSrc }}" alt="{{ personName }}" style="position:relative;width:100%;height:100%;object-fit:cover;object-position:center top;display:block">
  </div>
  <b style="font-weight:500;letter-spacing:0em;display:block;font-size:1.3375rem;color:#F7F6F4;margin-top:14px">{{ personName }}</b>
  <small style="color:rgba(255,255,255,.64);font-weight:400;font-size:.9rem;line-height:1.4;display:block;max-width:44ch;margin-top:2px">{{ position }}</small>
  <p style="font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-size:clamp(1.2rem,2.5vw,1.9rem);font-weight:500;letter-spacing:0em;line-height:1.3;max-width:60ch;margin:32px 0 0;color:#F7F6F4;text-wrap:pretty" dangerouslySetInnerHTML="{{ quoteHtml }}"></p>
  <img src="assets/icons/quote.svg" alt="" style="width:55px;height:auto;opacity:.2;flex:none;margin-top:38px">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:420},&quot;quote&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Вибір на користь SoftBees був продиктований потребою розробити застосунок у рекордні терміни.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;personName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Дмитро Бондаренко&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;position&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Член Правління, АТ «АСВІО БАНК»&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatarSrc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/testimonial-bondarenko.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;avatarSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:72,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:40,&quot;max&quot;:160}}">
class Component extends DCLogic {
  renderVals() {
    return {
      quoteHtml: {__html: this.props.quote ?? ''},
      personName: this.props.personName ?? '',
      position: this.props.position ?? '',
      avatarSrc: this.props.avatarSrc ?? 'assets/testimonial-bondarenko.png',
      avatarSize: this.props.avatarSize ?? 72
    };
  }
}
</script>
</body>
</html>
