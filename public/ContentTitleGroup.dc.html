<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<style>
  @font-face{font-family:"InterVariable";font-style:normal;font-weight:100 900;font-display:swap;src:url("https://rsms.me/inter/font-files/InterVariable.woff2?v=4.1") format("woff2")}
</style>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:6px">
  <h3 style="font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-weight:500;letter-spacing:-.011em;font-size:18px;line-height:1.3;margin:0;color:#F7F6F4;max-height:calc(1.3em * 2);overflow:hidden;flex:none">{{ title }}</h3>
  <p style="font-family: 'InterVariable','Inter',sans-serif; font-feature-settings: 'cv11' 1; font-weight: 400; letter-spacing:-.006em; font-size: 15px; line-height: 1.4; margin: 0; color: #9c9caa;flex:none">{{ subtitle }}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:90},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Онбординг&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Готовий модуль верифікації через Дію.&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
