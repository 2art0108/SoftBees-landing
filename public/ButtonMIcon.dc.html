<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a onClick="{{ onClick }}" style="{{ btnStyle }}" style-hover="background:rgba(255,255,255,.05)">
  <span style="{{ iconWrapStyle }}" dangerouslySetInnerHTML="{{ iconHtml }}"></span>{{ label }}
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:48},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LinkedIn&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;iconSvg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      label: this.props.label ?? '',
      onClick: this.props.onClick ?? (() => {}),
      iconHtml: {__html: this.props.iconSvg ?? ''},
      iconWrapStyle: {display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none', width: 20, height: 20},
      btnStyle: {
        position: 'relative', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9, flex: 'none', whiteSpace: 'nowrap',
        padding: '7px 14px', fontSize: '.94rem', fontWeight: 500, borderRadius: 10,
        letterSpacing: '0em', border: 'none', cursor: 'pointer', textDecoration: 'none', transition: 'background .25s ease',
        background: 'rgba(255,255,255,.08)', backdropFilter: 'blur(16px) saturate(160%)', WebkitBackdropFilter: 'blur(16px) saturate(160%)', color: '#F7F6F4'
      }
    };
  }
}
</script>
</body>
</html>
