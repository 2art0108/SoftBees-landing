<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ badgeStyle }}">{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:28},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fintech&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;frosted&quot;,&quot;options&quot;:[&quot;frosted&quot;,&quot;outline&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'frosted';
    const base = "display:inline-flex;align-items:center;padding:4px 9px 3px;border-radius:6px;font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;white-space:nowrap";
    const variants = {
      frosted: "background:rgba(255,255,255,.72);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);color:#0a0a0c",
      outline: "border:1px solid rgba(255,255,255,.12);background:transparent;color:#F7F6F4"
    };
    return {
      label: this.props.label ?? '',
      badgeStyle: base + ';' + (variants[variant] ?? variants.frosted)
    };
  }
}
</script>
</body>
</html>
