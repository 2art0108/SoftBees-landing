<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article onClick="{{ onClick }}" onMouseEnter="{{ onMouseEnter }}" onMouseLeave="{{ onMouseLeave }}" style="{{ cardStyle }}" class="sb-portfolio-card">
  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div style="padding:24px;display:flex;flex-direction:column;height:100%;box-sizing:border-box">
      <div style="{{ mobileImageOuterStyle }}">
        <div style="{{ imgWrapStyle }}">{{ vizEl }}</div>
      </div>
      <div style="{{ mobileBadgesRowStyle }}">
        <sc-for list="{{ badges }}" as="bd" hint-placeholder-count="3">
          <dc-import name="Badge" label="{{ bd }}" variant="outline" hint-size="auto,24px"></dc-import>
        </sc-for>
      </div>
      <h3 style="{{ mobileTitleStyle }}">{{ title }}</h3>
      <div style="margin-top:auto;padding-top:16px"><dc-import name="LinkArrow" label="Дізнатися більше" on-click="{{ onClick }}" hint-size="auto,24px"></dc-import></div>
    </div>
  </sc-if>
  <sc-if value="{{ isTablet }}" hint-placeholder-val="{{ false }}">
    <div style="{{ tabletOuterStyle }}">
      <div style="{{ tabletLeftStyle }}">
        <div style="{{ tabletBadgesRowStyle }}">
          <sc-for list="{{ badges }}" as="bd" hint-placeholder-count="3">
            <dc-import name="Badge" label="{{ bd }}" variant="outline" hint-size="auto,24px"></dc-import>
          </sc-for>
        </div>
        <div style="{{ tabletTitleWrapStyle }}">
          <h3 style="{{ tabletTitleStyle }}">{{ title }}</h3>
        </div>
        <div><dc-import name="LinkArrow" label="Дізнатися більше" on-click="{{ onClick }}" hint-size="auto,24px"></dc-import></div>
      </div>
      <div style="{{ tabletImageOuterStyle }}">
        <div style="{{ imgWrapStyle }}">{{ vizEl }}</div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="padding:24px;display:flex;flex-direction:column;height:100%;box-sizing:border-box">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
        <div style="display:flex;flex-direction:column;gap:10px;flex:none;padding-top:2px">
          <sc-for list="{{ badges }}" as="bd" hint-placeholder-count="3">
            <dc-import name="Badge" label="{{ bd }}" variant="outline" hint-size="auto,24px"></dc-import>
          </sc-for>
        </div>
        <div style="width:56%;max-width:320px;flex:none;aspect-ratio:954/840;border-radius:12px;overflow:hidden;position:relative;background:rgba(255,255,255,.032)">
          <div style="position:absolute;left:0;right:0;top:0;height:100%">
            <div style="{{ imgWrapStyle }}">{{ vizEl }}</div>
          </div>
        </div>
      </div>
      <h3 style="font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-weight:500;letter-spacing:-.013em;font-size:1.3rem;line-height:1.3;margin:32px 0 0;color:#F7F6F4;max-width:min(400px,calc(100% - 100px));min-height:calc(1.3em * 3)">{{ title }}</h3>
      <div style="margin-top:32px">
        <dc-import name="LinkArrow" label="Дізнатися більше" on-click="{{ onClick }}" hint-size="auto,24px"></dc-import>
      </div>
    </div>
  </sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:360},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Проєкт&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;domain&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;FINTECH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;country&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Нігерія&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;platform&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;MOBILE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vizEl&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;flexItem&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;frost&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { hover: false, isTablet: false, isMobile: false };
  componentDidMount() {
    this._onResize = () => {
      const w = window.innerWidth;
      const isTablet = w >= 660 && w <= 992;
      const isMobile = w < 660;
      if (isTablet !== this.state.isTablet || isMobile !== this.state.isMobile) this.setState({ isTablet, isMobile });
    };
    this._onResize();
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
  }
  renderVals() {
    const flex = this.props.flexItem ?? false;
    const frost = this.props.frost ?? false;
    const badges = [this.props.domain, this.props.country, this.props.platform].filter(Boolean);
    return {
      onClick: this.props.onClick ?? (() => {}),
      vizEl: this.props.vizEl,
      badges,
      title: this.props.title ?? '',
      isTablet: this.state.isTablet && !this.state.isMobile,
      isMobile: this.state.isMobile,
      isDesktop: !this.state.isTablet && !this.state.isMobile,
      mobileImageOuterStyle: {width: 'calc(100% + 24px)', marginInline: -12, marginTop: -12, aspectRatio: '954/840', borderRadius: 8, flex: 'none', overflow: 'hidden', position: 'relative', background: 'rgba(255,255,255,.032)', marginBottom: 20},
      mobileBadgesRowStyle: {display: 'flex', flexDirection: 'row', flexWrap: 'wrap', gap: 8, marginBottom: 16},
      mobileTitleStyle: {
        fontFamily: "'InterVariable','Inter',sans-serif", fontFeatureSettings: "'cv11' 1", fontWeight: 500, letterSpacing: '-.013em',
        fontSize: '1.3rem', lineHeight: 1.3, margin: 0, color: '#F7F6F4', maxWidth: 'none'
      },
      tabletOuterStyle: {padding: 24, boxSizing: 'border-box', display: 'flex', flexDirection: 'row', gap: 20, height: '100%', alignItems: 'stretch'},
      tabletLeftStyle: {flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', justifyContent: 'space-between'},
      tabletBadgesRowStyle: {display: 'flex', flexDirection: 'row', flexWrap: 'wrap', gap: 8},
      tabletTitleWrapStyle: {flex: 1, display: 'flex', alignItems: 'center'},
      tabletTitleStyle: {
        fontFamily: "'InterVariable','Inter',sans-serif", fontFeatureSettings: "'cv11' 1", fontWeight: 500, letterSpacing: '-.013em',
        fontSize: '1.3rem', lineHeight: 1.3, margin: 0, color: '#F7F6F4'
      },
      tabletImageOuterStyle: {
        alignSelf: 'flex-start', flex: '0 0 42%', width: '42%', maxWidth: '42%', height: 'auto', aspectRatio: '954/840',
        borderRadius: 12, overflow: 'hidden', position: 'relative', background: 'rgba(255,255,255,.032)'
      },
      imgWrapStyle: {
        width: '100%', height: '100%', transform: this.state.hover ? 'scale(1.015)' : 'scale(1)',
        transition: 'transform .6s ease-out'
      },
      cardStyle: {
        position: 'relative', boxSizing: 'border-box', display: 'flex', flexDirection: 'column',
        flex: flex ? '0 0 clamp(320px,42vw,520px)' : undefined,
        height: '100%',
        borderRadius: 24, border: '1px solid rgba(255,255,255,.06)', background: 'rgba(255,255,255,.032)',
        ...(frost ? {backdropFilter: 'blur(16px) saturate(1.6)', WebkitBackdropFilter: 'blur(16px) saturate(1.6)'} : {}),
        overflow: 'hidden', cursor: 'pointer'
      },
      onMouseEnter: () => this.setState({hover: true}),
      onMouseLeave: () => this.setState({hover: false})
    };
  }
}
</script>
</body>
</html>
