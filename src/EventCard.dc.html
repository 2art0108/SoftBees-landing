<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article onClick="{{ onClick }}" onMouseEnter="{{ onMouseEnter }}" onMouseLeave="{{ onMouseLeave }}" style="{{ cardStyle }}">
  <div style="padding:8px">
    <div style="aspect-ratio:16/10;position:relative;overflow:hidden;border-radius:12px">
      <div ref="{{ setParallaxRef }}" style="position:absolute;left:0;right:0;top:-14px;height:calc(100% + 28px)">
        <div style="{{ imgWrapStyle }}">{{ vizEl }}</div>
      </div>
      <div style="position:absolute;top:12px;left:12px"><dc-import name="Badge" label="{{ tag }}" variant="frosted" hint-size="auto,24px"></dc-import></div>
    </div>
  </div>
  <div style="padding:14px 26px 28px;box-sizing:border-box;height:158px;position:relative;overflow:hidden">
    <div ref="{{ setContentRef }}">
      <dc-import name="ContentTitleGroup" title="{{ title }}" subtitle="{{ subtitle }}" hint-size="100%,auto"></dc-import>
    </div>
    <sc-if value="{{ showFade }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;bottom:8px;height:36px;background:linear-gradient(180deg,rgba(15,15,15,0) 0%,rgba(15,15,15,.5) 45%,rgba(15,15,15,.92) 85%,rgba(15,15,15,1) 100%);pointer-events:none"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;height:8px;background:#0f0f0f;pointer-events:none"></div>
    </sc-if>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:340},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Подія&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Короткий опис події&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Events&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;vizEl&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { hover: false, showFade: false };
  setContentRef = (el) => {
    this._contentEl = el;
    this.measureFade();
  };
  measureFade = () => {
    if (!this._contentEl) return;
    const naturalHeight = this._contentEl.scrollHeight;
    const available = 116; // 158px zone minus 14px top / 28px bottom padding
    const remaining = available - naturalHeight;
    const showFade = remaining <= 20;
    if (showFade !== this.state.showFade) this.setState({showFade});
  };
  componentDidUpdate(prevProps) {
    if (prevProps.title !== this.props.title || prevProps.subtitle !== this.props.subtitle) this.measureFade();
  }
  setParallaxRef = (el) => {
    if (!el || el === this._pEl) return;
    this._pEl = el;
    if (!this._onScroll) {
      this._onScroll = () => {
        if (this._raf) return;
        this._raf = requestAnimationFrame(() => {
          this._raf = null;
          if (!this._pEl) return;
          const rect = this._pEl.getBoundingClientRect();
          const vh = window.innerHeight || 1;
          const progress = (vh - rect.top) / (vh + rect.height);
          const shift = (progress - 0.5) * 24;
          this._pEl.style.transform = 'translateY(' + shift.toFixed(2) + 'px)';
        });
      };
      window.addEventListener('scroll', this._onScroll, {passive: true});
    }
    this._onScroll();
  };
  componentWillUnmount() {
    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  renderVals() {
    return {
      setParallaxRef: this.setParallaxRef,
      setContentRef: this.setContentRef,
      showFade: this.state.showFade,
      onClick: this.props.onClick ?? (() => {}),
      vizEl: this.props.vizEl,
      tag: this.props.tag ?? '',
      title: this.props.title ?? '',
      subtitle: this.props.subtitle ?? '',
      imgWrapStyle: {
        width: '100%', height: '100%', transform: this.state.hover ? 'scale(1.045)' : 'scale(1)',
        transition: 'transform .6s ease-out'
      },
      cardStyle: {
        position: 'relative', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', height: '100%',
        borderRadius: 20, border: '1px solid rgba(255,255,255,.06)', background: 'rgba(255,255,255,.032)',
        overflow: 'hidden', cursor: 'pointer'
      },
      onMouseEnter: () => this.setState({hover: true}),
      onMouseLeave: () => this.setState({hover: false})
    };
  }
}
</script>
</body>
</html>
