<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;overflow:hidden;border-radius:32px;padding:clamp(60px,7.3vw,102px);text-align:center;background:#6E00E4">
  <sc-if value="{{ showShader }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;width:100%;height:100%;overflow:hidden"><div ref="{{ setShaderRef }}" style="width:100%;height:100%" data-us-project="8tZ0mgiupLQatIxw3nH8"></div></div>
    <div style="position:absolute;top:-30%;left:-30%;width:70%;height:160%;background:#6E00E4;filter:blur(150px);opacity:.85;pointer-events:none"></div>
  </sc-if>
  <div style="position:absolute;width:60%;height:75%;top:-31%;left:-19%;background:#2D31FF;border-radius:42% 58% 61% 39%/48% 40% 60% 52%;filter:blur(130px);opacity:.16;pointer-events:none;transform:rotate(8deg)"></div>
  <div style="position:absolute;width:55%;height:70%;bottom:-26%;right:-12%;background:#FF1C55;border-radius:55% 45% 38% 62%/40% 55% 45% 60%;filter:blur(130px);opacity:.6;pointer-events:none;transform:rotate(-10deg)"></div>
  <div style="position:absolute;width:42%;height:50%;top:8%;right:2%;background:#FFEB10;border-radius:60% 40% 55% 45%/55% 60% 40% 45%;filter:blur(130px);opacity:.4;pointer-events:none"></div>
  <h2 style="position:relative;font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-weight:500;letter-spacing:-.02em;margin:0 auto;max-width:18ch;font-size:clamp(1.95rem,4.2vw,3.3rem);line-height:1.1">{{ title }}</h2>
  <p style="position:relative;margin:20px auto 0;font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-weight:400;font-size:clamp(1rem,1.5vw,1.1rem);line-height:1.5;color:rgba(255,255,255,.85);max-width:52ch">{{ subtitle }}</p>
  <a onClick="{{ onButtonClick }}" style="position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;flex:none;white-space:nowrap;padding:12px 22px;border-radius:12px;font-size:1rem;font-weight:500;letter-spacing:0em;border:none;background:#0a0a0c;color:#fff;margin-top:32px;cursor:pointer;text-decoration:none;transition:background .25s ease" style-hover="background:rgba(10,10,12,.92)">{{ buttonLabel }}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:420},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Готові прискорити запуск вашого банку?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Розкажіть, що плануєте будувати — підберемо модулі платформи та команду під ваш ринок.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;buttonLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Замовити консультацію&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onButtonClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;showShader&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  setShaderRef = (el) => { this._shaderEl = el; };

  // A scene whose element is no longer attached (e.g. left over from a
  // previous route's unmounted FinalCTA) holds a live WebGL context and
  // render loop forever unless removed — that leak is the root cause of
  // the shader going blank on later pages (too many live GL contexts).
  _pruneDetachedScenes() {
    const us = window.UnicornStudio;
    if (!us || !Array.isArray(us.scenes)) return;
    for (let i = us.scenes.length - 1; i >= 0; i--) {
      const scene = us.scenes[i];
      const el = scene && scene.element;
      if (!el || !document.body.contains(el)) {
        try { if (typeof scene.destroy === 'function') scene.destroy(); } catch (e) {}
        us.scenes.splice(i, 1);
      }
    }
  }

  componentDidMount() {
    if (!(this.props.showShader ?? false)) return;
    let tries = 0;
    const tryInit = () => {
      if (window.UnicornStudio && typeof window.UnicornStudio.init === 'function') {
        this._pruneDetachedScenes();
        window.UnicornStudio.init();
      } else if (tries++ < 50) {
        setTimeout(tryInit, 100);
      }
    };
    tryInit();
  }

  componentWillUnmount() {
    const us = window.UnicornStudio;
    if (!us || !Array.isArray(us.scenes) || !this._shaderEl) return;
    for (let i = us.scenes.length - 1; i >= 0; i--) {
      if (us.scenes[i].element === this._shaderEl) {
        try { if (typeof us.scenes[i].destroy === 'function') us.scenes[i].destroy(); } catch (e) {}
        us.scenes.splice(i, 1);
      }
    }
  }

  renderVals() {
    return {
      title: this.props.title ?? '',
      subtitle: this.props.subtitle ?? '',
      buttonLabel: this.props.buttonLabel ?? 'Замовити консультацію',
      onButtonClick: this.props.onButtonClick ?? (() => {}),
      showShader: this.props.showShader ?? false,
      setShaderRef: this.setShaderRef
    };
  }
}
</script>
</body>
</html>
