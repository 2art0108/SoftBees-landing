<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="display: grid; grid-template-columns: 1fr 1fr; gap: 0; overflow: hidden">
  <div style="padding:16px">
    <div style="aspect-ratio: 16/11.25; position: relative; overflow: hidden; border-radius: 9px">
      <img onClick="{{ onClick }}" src="{{ imgSrc }}" alt="{{ imgAlt }}" style="width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;transition:transform .6s ease-out" style-hover="transform:scale(1.02)">
      <div style="position:absolute;top:12px;left:12px"><dc-import name="Badge" label="{{ badgeLabel }}" variant="frosted" hint-size="auto,24px"></dc-import></div>
    </div>
  </div>
  <div style="padding: 14px clamp(28px,3.4vw,48px) 28px 14px; display: flex; flex-direction: column; justify-content: center; padding-left: 32px; padding-right: clamp(28px,3.4vw,64px)">
    <h3 style="font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-weight:500;letter-spacing:-.017em;font-size:clamp(1.8125rem,2.9vw,2.4125rem);line-height:1.2;margin:0 0 14px;color:#F7F6F4">{{ title }}</h3>
    <p style="font-family:'InterVariable','Inter',sans-serif;font-feature-settings:'cv11' 1;font-weight:400;font-size:15px;line-height:1.4;letter-spacing:-.006em;color:rgba(255,255,255,.64);margin:0">{{ desc }}</p>
    <div style="margin-top:28px">
      <dc-import name="Button" label="{{ buttonLabel }}" size="M" variant="white" on-click="{{ onClick }}" hint-size="auto,40px"></dc-import>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:360},&quot;imgSrc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/events/ai-native-transformation.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgAlt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badgeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Insights&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ми трансформуємось в AI-native компанію&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;buttonLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Читати статтю&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      imgSrc: this.props.imgSrc ?? '',
      imgAlt: this.props.imgAlt ?? '',
      badgeLabel: this.props.badgeLabel ?? 'Insights',
      title: this.props.title ?? '',
      desc: this.props.desc ?? '',
      buttonLabel: this.props.buttonLabel ?? 'Читати статтю',
      onClick: this.props.onClick ?? (() => {})
    };
  }
}
</script>
</body>
</html>
